# Server_Config.ini - ServerApp / LoginServer / DummyClient 공용 서버 설정 견본
#
# 사용법 (구 db_config.txt 를 쓰던 사람도 이 순서를 따른다):
#   1) 서버 실행 폴더 아래에 conf 폴더를 만든다 (빌드가 만들어주지 않는다):
#        Build\x64\Debug\conf\
#        Build\x64\Release\conf\
#   2) 이 파일을 그 폴더에 Server_Config.ini 라는 이름으로 복사한다.
#   3) 아래 값들을 실제 값으로 채운다. 구 db_config.txt 가 있다면 거기서 "값만" 옮겨 적는다
#      (파일을 통째로 복사하지 않는다 - 섹션 헤더와 키 이름이 달라졌다).
#   4) Debug 와 Release 두 폴더에 같은 작업을 한다.
#
# 형식: [섹션] 아래에 key=value (한 줄에 하나). '#' 또는 ';' 로 시작하는 줄과 빈 줄은 무시한다.
#   섹션이 값의 목적지를 정한다: [database] -> DB 접속 / [server] -> 게임 서버 공개 주소 / [interserver] -> 서버 간 링크.
#   섹션 헤더 없이 키만 쓰면 부팅이 거부된다(어느 설정인지 알 수 없기 때문).
#   [주의] 줄 끝 주석은 지원하지 않는다. "password=abc # 메모" 라고 쓰면 "abc # 메모" 전체가 비밀번호가 된다.
#          (비밀번호에 # 를 쓸 수 있어야 하므로 일부러 지원하지 않는다. 주석은 줄 전체로만 쓴다.)
#   [주의] 이 파일은 BOM 없이 저장한다. 메모장으로 "UTF-8(BOM)" 저장하지 않는다.
#
# 실제 Server_Config.ini 는 비밀번호를 포함하므로 .gitignore 되어 커밋되지 않는다.
# 키가 없거나 값 형식이 틀리면 부팅이 중단되고, 어느 섹션의 어느 키가 문제인지 콘솔에 찍힌다
# (조용한 기본값 폴백 없음).

# ===== DB 접속 (MySQL) =====
#   읽는 프로세스: ServerApp / LoginServer.
#   DummyClient 는 MySQL 을 쓰지 않으므로 이 섹션을 읽지도 검증하지도 않는다
#   -> DB 자격증명이 없는 머신에서도 부하테스트 봇을 띄울 수 있다.
#   user / password / dbname 은 필수.
#   host / port 는 줄이 아예 없으면 127.0.0.1 / 3306 을 쓴다.
#   단 줄을 쓰고 값이 비었거나 깨져 있으면(host= , port= , port=abc, port=3306x)
#   기본값으로 넘어가지 않고 부팅을 거부한다 - 기본값을 원하면 그 줄을 통째로 지운다.
#   (빈 host 를 그냥 넘기면 MySQL 클라이언트가 로컬로 해석해 "연결 성공"이 되는데,
#    원격 DB 주소를 지우다 만 사고가 로컬 접속으로 조용히 덮이므로 형식 오류로 잡는다.)
[database]
host=127.0.0.1
port=3306
user=kys_app
password=여기에_실제_비밀번호를_넣는다
dbname=kys_game

# ===== 게임 서버 공개 주소 =====
#   읽는 프로세스: ServerApp / LoginServer / DummyClient (셋 다).
#   [필수] 두 키 모두 없으면 부팅이 중단된다. 세 프로세스가 이 값을 각자 다르게 쓴다:
#     ServerApp   - 이 포트로 listen 하고, 이 IP 를 로그인 서버에 자기 주소로 보고한다
#     LoginServer - 이 주소를 클라에게 광고한다(SC_SERVER_LIST / SC_LOGIN_TOKEN)
#     DummyClient - 이 포트로 봇을 접속시킨다
#   한 파일에서 나오므로 세 값이 어긋날 수 없다. 포트를 바꾸면 셋 다 따라간다.
#   코드에는 이 포트의 기본값 상수가 없다 - 여기가 유일한 출처다.
#   다른 머신의 클라가 붙게 하려면 이 머신의 LAN IP(예 172.30.1.78)로 바꾼다.
#   public_ip 는 점표기(a.b.c.d)만 받는다 - 호스트명(localhost)은 형식 오류로 거부한다.
#     정확히 4옥텟, 각 옥텟 0..255, 값 뒤에 다른 글자가 붙으면 안 된다.
#     거부 예: localhost / 127.0.0 / 127.0.0.300 / 127.0.0.1x / 1.2.3.4.5
#   public_port 는 값 전체가 숫자여야 한다 - "7777x" 같은 값은 거부한다.
[server]
public_ip=127.0.0.1
public_port=7777

# ===== 서버 간 링크 (LoginServer <-> ServerApp) =====
#   읽는 프로세스: ServerApp / LoginServer.
#   DummyClient 는 이 링크에 참여하지 않으므로 이 섹션을 읽지도 검증하지도 않는다.
#   secret = 링크 공유 비밀. 가짜 게임 서버가 로그인 서버에 등록하는 것을 막는다.
#   [필수] 값이 없거나 0이면 부팅이 중단된다(fail-open 방지 - 0==0 통과 차단).
#   랜덤한 32비트 값 권장. 16진(0x..) 또는 10진 모두 가능하며 값 전체가 숫자여야 한다.
#   [불변식] 세 프로세스가 같은 폴더의 같은 파일을 읽으므로 값이 어긋날 수 없다.
#           "authKey 불일치" 경고가 뜨면 (1) Debug 와 Release 를 교차 기동했거나
#           (2) 이 값을 고친 뒤 한쪽 프로세스만 재기동했거나 (3) 두 머신에 나눠 배포한 경우다.
#           마지막 경우에는 두 머신의 이 값이 반드시 같아야 한다.
[interserver]
secret=0x7A3F91C4
