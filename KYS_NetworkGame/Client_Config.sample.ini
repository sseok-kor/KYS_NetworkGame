# Client_Config.ini - GameClient 접속 설정 견본
#
# 사용법 (Server_Config 견본과 같은 절차):
#   1) 클라 실행 폴더 아래 conf 폴더가 없으면 만든다 (서버 설정과 같은 폴더다):
#        Build\x64\Debug\conf\
#        Build\x64\Release\conf\
#   2) 이 파일을 그 폴더에 Client_Config.ini 라는 이름으로 복사한다.
#   3) host 를 로그인 서버가 도는 머신의 IP 로 맞춘다 (같은 PC 에서 돌리면 127.0.0.1 그대로).
#   4) Debug 와 Release 두 폴더에 같은 작업을 한다.
#
# 형식: [섹션] 아래에 key=value (한 줄에 하나). '#' 또는 ';' 로 시작하는 줄과 빈 줄은 무시한다.
#   [주의] 줄 끝 주석은 지원하지 않는다. 주석은 줄 전체로만 쓴다.
#   [주의] 이 파일은 BOM 없이 저장한다. 메모장으로 "UTF-8(BOM)" 저장하지 않는다.
#
# 이 파일에는 비밀을 넣지 않는다 - DB 비밀번호와 인터서버 비밀은 Server_Config.ini(서버 전용, .gitignore)에 있다.
#   클라 배포본에 실리는 파일이므로 여기 적은 것은 전부 공개된 값이라고 본다.
# 키가 없거나 값 형식이 틀리면 클라가 뜨지 않고, 어느 키가 문제인지 콘솔에 [Client_Config] 접두어로 찍힌다
# (조용한 기본값 폴백 없음 - 서버와 같은 규칙).

# ===== 로그인 서버 주소 =====
#   GameClient 가 처음 붙는 곳이다. 포트는 코드 상수(LOGIN_CLIENT_PORT = 7001)라 여기 없다.
#   게임 서버 주소도 여기 없다 - 로그인 서버가 로그인 성공 응답에 실어 내려주고 클라는 그 주소로만 붙는다.
#   host 는 점표기(a.b.c.d)만 받는다 - 호스트명(localhost)은 형식 오류로 거부한다.
#     정확히 4옥텟, 각 옥텟 0..255, 값 뒤에 다른 글자가 붙으면 안 된다. 0.0.0.0 은 거부한다.
#   Debug 빌드는 로그인 화면에 이 값을 초기값으로 한 "서버 IP" 입력칸을 보여 다른 서버로 바꿔 붙을 수 있다.
#   Release 빌드에는 입력칸이 없다 - 이 값으로만 붙는다.
[login]
host=127.0.0.1
